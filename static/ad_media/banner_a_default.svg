<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180"
     role="img" aria-label="PPPoker Hand Tracker — Banner A placeholder">
  <title>PPPoker Hand Tracker — Banner A placeholder</title>
  <!-- Hard-saved default for the ad_media "banner_a" type (see
       _AD_MEDIA_TYPES in app.py). Swap for real creative at
       /admin -> Ad Campaigns -> Admin media library, or replace this file. -->
  <defs>
    <linearGradient id="bagbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B161F"/>
      <stop offset="0.55" stop-color="#0d1f17"/>
      <stop offset="1" stop-color="#061410"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bagbg)"/>
  <rect x="4" y="4" width="312" height="172" rx="10" fill="none" stroke="#1D5D3D" stroke-width="2"/>
  <text x="160" y="86" text-anchor="middle" font-size="22" fill="#00e676"
        font-family="Oxanium, 'Segoe UI', system-ui, sans-serif" font-weight="800"
        textLength="230" lengthAdjust="spacingAndGlyphs">BANNER A</text>
  <text x="160" y="112" text-anchor="middle" font-size="12" fill="#6b8c6b"
        font-family="'Segoe UI', system-ui, sans-serif"
        textLength="200" lengthAdjust="spacingAndGlyphs">Ad Campaigns default slot</text>
  <text x="160" y="160" text-anchor="middle" font-size="9" fill="#3f5f4a"
        font-family="'Segoe UI', system-ui, sans-serif"
        textLength="90" lengthAdjust="spacingAndGlyphs">PLACEHOLDER ART</text>
</svg>
