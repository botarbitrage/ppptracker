<svg xmlns="http://www.w3.org/2000/svg" width="120" height="480" viewBox="0 0 120 480"
     role="img" aria-label="Leak Finder — find the spots that cost you chips">
  <title>Leak Finder — find the spots that cost you chips</title>
  <!-- Placeholder promo art for the vertical side banner slot (120x480).
       Second rotation frame: the Leak Finder page (templates/leaks.html). -->
  <defs>
    <linearGradient id="s2bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0B161F"/>
      <stop offset="0.6" stop-color="#101d24"/>
      <stop offset="1" stop-color="#07131a"/>
    </linearGradient>
  </defs>

  <rect width="120" height="480" fill="url(#s2bg)"/>
  <path d="M10 26 V10 H30" fill="none" stroke="#1D5D3D" stroke-width="2"/>
  <path d="M110 454 V470 H90" fill="none" stroke="#1D5D3D" stroke-width="2"/>

  <!-- magnifier mark -->
  <g transform="translate(60 78)" fill="none" stroke="#40c4ff" stroke-width="3">
    <circle cx="-4" cy="-4" r="15"/>
    <line x1="7" y1="7" x2="17" y2="17" stroke-linecap="round"/>
  </g>

  <g font-family="Oxanium, 'Segoe UI', system-ui, sans-serif" font-weight="800"
     text-anchor="middle" fill="#40c4ff">
    <text x="60" y="130" font-size="18" textLength="52" lengthAdjust="spacingAndGlyphs">LEAK</text>
    <text x="60" y="153" font-size="18" textLength="84" lengthAdjust="spacingAndGlyphs">FINDER</text>
  </g>

  <line x1="30" y1="171" x2="90" y2="171" stroke="#1D5D3D" stroke-width="1"/>

  <!-- descending "leak" bars -->
  <g transform="translate(30 196)">
    <rect x="0"  y="0"  width="60" height="7" rx="3" fill="#00e676" opacity=".85"/>
    <rect x="0"  y="14" width="46" height="7" rx="3" fill="#00e676" opacity=".6"/>
    <rect x="0"  y="28" width="34" height="7" rx="3" fill="#cccc00" opacity=".75"/>
    <rect x="0"  y="42" width="22" height="7" rx="3" fill="#ff5252" opacity=".8"/>
  </g>

  <!-- Centred at y=315 with a 130px run: starts at y=250, below the bars
       (which end at y=245), and finishes at y=380, clear of the CTA at y=396. -->
  <text transform="translate(60 315) rotate(-90)" text-anchor="middle"
        font-family="Oxanium, 'Segoe UI', system-ui, sans-serif" font-weight="600"
        font-size="12" fill="#6b8c6b" textLength="130" lengthAdjust="spacingAndGlyphs">
    SPOT THE COSTLY SPOTS
  </text>

  <rect x="14" y="396" width="92" height="34" rx="8" fill="none"
        stroke="#40c4ff" stroke-width="1.5"/>
  <text x="60" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#40c4ff"
        font-family="Oxanium, 'Segoe UI', system-ui, sans-serif"
        textLength="70" lengthAdjust="spacingAndGlyphs">FIND MY LEAKS</text>

  <text x="60" y="450" text-anchor="middle" font-size="8" fill="#3f5f4a"
        font-family="'Segoe UI', system-ui, sans-serif"
        textLength="66" lengthAdjust="spacingAndGlyphs">PLACEHOLDER ART</text>
</svg>
