<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — PPPoker Hand Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/style.css?v=55"/>
  <style>
    .page-back {
      display:inline-flex; align-items:center; gap:6px; color:var(--muted);
      font-family:var(--font-head); font-size:.78rem; font-weight:600;
      letter-spacing:.4px; text-decoration:none; padding:4px 0; transition:color .15s;
    }
    .page-back:hover { color:var(--green); }
    .page-title {
      font-family:var(--font-head); font-size:clamp(.95rem,3.5vw,1.4rem);
      font-weight:800; color:var(--green);
    }
    .adm-meta { color:var(--muted); font-size:.85rem; }

    /* ── Sidebar shell ─────────────────────────────────────── */
    .adm-shell { display:flex; gap:20px; align-items:flex-start; }
    .adm-sidebar { flex:0 0 190px; width:190px; padding:10px; }
    /* min-width:0 tames the row axis; max-width:100% stops the table widening
       the column when the sidebar stacks on mobile. */
    .adm-main { flex:1 1 auto; min-width:0; max-width:100%; }

    .adm-nav-item {
      display:flex; align-items:center; gap:9px; width:100%;
      padding:9px 12px; margin-bottom:4px;
      background:transparent; border:1px solid transparent; border-radius:8px;
      color:var(--muted); font-family:var(--font-head); font-size:.82rem;
      font-weight:600; letter-spacing:.4px; text-align:left; white-space:nowrap;
      cursor:pointer; transition:background .15s, color .15s, border-color .15s;
    }
    .adm-nav-item:hover { background:rgba(0,230,118,.07); color:var(--text); }
    .adm-nav-item.active {
      background:rgba(0,230,118,.12); border-color:rgba(0,230,118,.35);
      color:var(--green);
    }
    .adm-nav-note {
      color:var(--muted); font-family:var(--font-body); font-size:.72rem;
      padding:10px 12px 4px; border-top:1px solid var(--border); margin-top:8px;
    }

    /* ── Users panel ───────────────────────────────────────── */
    .adm-toolbar {
      display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px;
      border-bottom:1px solid var(--border);
    }
    .adm-search { max-width:280px; }
    .adm-btn {
      font-family:var(--font-head); font-size:.76rem; font-weight:700;
      letter-spacing:.4px; padding:5px 13px; border-radius:8px;
      background:rgba(0,230,118,.07); border:1px solid rgba(0,230,118,.22);
      color:var(--green); cursor:pointer; transition:background .15s, border-color .15s;
    }
    .adm-btn:hover:not(:disabled) { background:rgba(0,230,118,.14); border-color:rgba(0,230,118,.4); }
    .adm-btn:disabled { opacity:.5; cursor:default; }

    .adm-email { font-family:var(--font-body); color:var(--text); word-break:break-all; }
    .adm-uid { font-family:var(--font-body); font-size:.72rem; color:var(--muted); }
    .adm-pill {
      display:inline-block; margin-left:7px; padding:1px 8px; border-radius:20px;
      font-family:var(--font-head); font-size:.62rem; font-weight:700;
      letter-spacing:.5px; text-transform:uppercase;
      background:rgba(0,230,118,.12); border:1px solid rgba(0,230,118,.35);
      color:var(--green); vertical-align:middle;
    }
    .adm-pill.off {
      background:rgba(255,82,82,.12); border-color:rgba(255,82,82,.35); color:var(--red);
    }
    .adm-date { font-family:var(--font-body); font-size:.82rem; color:var(--muted); white-space:nowrap; }
    .adm-check { width:1.05rem; height:1.05rem; cursor:pointer; }
    .adm-check:disabled { cursor:default; opacity:.75; }
    .adm-row-busy { opacity:.5; }

    @media (max-width: 768px) {
      /* align-items:flex-start shrink-wraps items on the cross axis, which once
         the direction flips to column means the table widens the whole page
         instead of scrolling inside .table-responsive. */
      .adm-shell { flex-direction:column; align-items:stretch; }
      .adm-sidebar {
        flex:1 1 auto; width:100%; display:flex; gap:6px;
        overflow-x:auto; padding:8px;
      }
      .adm-nav-item { width:auto; margin-bottom:0; }
      .adm-nav-note { display:none; }
      .adm-search { max-width:100%; }
    }
  </style>
</head>
<body>
  <div class="container py-3" style="max-width:1100px;">
    <a href="/" class="page-back">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Analyser
    </a>
    <div class="d-flex align-items-center gap-3 flex-wrap mt-2 mb-3">
      <span class="page-title">♠ Admin</span>
      <span id="adm-summary" class="adm-meta"></span>
    </div>

    <div id="adm-status" class="adm-meta py-4"></div>
    <div id="adm-error" class="alert alert-danger d-none"></div>

    <div id="adm-body" class="d-none">
      <div class="adm-shell">

        <!-- ── Sidebar ─────────────────────────────────────── -->
        <nav class="section-card adm-sidebar" aria-label="Admin sections">
          <button type="button" class="adm-nav-item active" data-section="users" onclick="switchSection('users')">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Users
          </button>
          <div class="adm-nav-note">More sections coming soon.</div>
        </nav>

        <!-- ── Panels ──────────────────────────────────────── -->
        <div class="adm-main">

          <section class="section-card adm-panel" id="panel-users">
            <div class="section-header">
              <h2>Users</h2>
            </div>
            <div class="adm-toolbar">
              <input type="search" id="adm-search" class="form-control form-control-sm adm-search"
                     placeholder="Search email…" aria-label="Search users by email"/>
              <span class="adm-meta flex-grow-1" id="adm-count"></span>
              <button type="button" class="adm-btn" id="adm-refresh" onclick="reload()">Refresh</button>
            </div>
            <div id="adm-users-error" class="alert alert-danger d-none m-3 mb-0 py-2"></div>
            <div class="table-responsive">
              <table class="table table-dark table-striped table-hover mb-0">
                <thead>
                  <tr>
                    <th>Email</th>
                    <th>Signed up</th>
                    <th>Last sign-in</th>
                    <th class="text-center">Admin</th>
                  </tr>
                </thead>
                <tbody id="adm-users-body"></tbody>
              </table>
            </div>
          </section>

        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
  let AUTH_USER = null;
  let USERS = [];           // /api/admin/users response, newest fetch wins

  async function authFetch(url, opts) {
    const token = await AUTH_USER.getIdToken();
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + token });
    return fetch(url, opts);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtDate(secs) {
    if (!secs) return '—';
    return new Date(secs * 1000).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  // ── Sidebar ────────────────────────────────────────────────────────────────
  function switchSection(name) {
    document.querySelectorAll('.adm-nav-item').forEach(b =>
      b.classList.toggle('active', b.dataset.section === name));
    document.querySelectorAll('.adm-panel').forEach(p =>
      p.classList.toggle('d-none', p.id !== 'panel-' + name));
  }

  // ── Users table ────────────────────────────────────────────────────────────
  function renderUsers() {
    const q = (document.getElementById('adm-search').value || '').trim().toLowerCase();
    const rows = q ? USERS.filter(u => (u.email || '').toLowerCase().includes(q)) : USERS;
    const body = document.getElementById('adm-users-body');

    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="4" class="text-center adm-meta py-4">` +
        (USERS.length ? 'No users match that search.' : 'No registered users yet.') +
        `</td></tr>`;
    } else {
      body.innerHTML = rows.map(u => {
        const pills = (u.is_permanent ? '<span class="adm-pill">Permanent</span>' : '') +
                      (u.disabled ? '<span class="adm-pill off">Disabled</span>' : '');
        return `<tr data-uid="${esc(u.uid)}">
          <td>
            <div class="adm-email">${u.email ? esc(u.email) : '<span class="adm-meta">(no email)</span>'}${pills}</div>
            <div class="adm-uid">${esc(u.uid)}</div>
          </td>
          <td class="adm-date">${esc(fmtDate(u.created_at))}</td>
          <td class="adm-date">${esc(fmtDate(u.last_sign_in))}</td>
          <td class="text-center">
            <input type="checkbox" class="form-check-input adm-check"
                   aria-label="Admin"
                   ${u.is_admin ? 'checked' : ''} ${u.is_permanent ? 'disabled' : ''}
                   onchange="setAdmin('${esc(u.uid)}', this)"/>
          </td>
        </tr>`;
      }).join('');
    }

    const admins = USERS.filter(u => u.is_admin).length;
    const shown  = rows.length === USERS.length ? '' : ` · showing ${rows.length}`;
    document.getElementById('adm-count').textContent =
      `${USERS.length} user${USERS.length === 1 ? '' : 's'} · ${admins} admin${admins === 1 ? '' : 's'}${shown}`;
  }

  async function setAdmin(uid, checkbox) {
    const want = checkbox.checked;
    const user = USERS.find(u => u.uid === uid);

    // Demoting yourself is allowed (a permanent admin can always restore you),
    // but it costs you this page, so make it deliberate.
    if (!want && AUTH_USER && uid === AUTH_USER.uid &&
        !confirm('Remove your own admin access? You will lose access to this page.')) {
      checkbox.checked = true;
      return;
    }

    const row = checkbox.closest('tr');
    checkbox.disabled = true;
    if (row) row.classList.add('adm-row-busy');
    showUsersError('');

    try {
      const res = await authFetch(`/api/admin/users/${encodeURIComponent(uid)}/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_admin: want }),
      });
      if (!res.ok) {
        checkbox.checked = !want;  // revert — the server rejected it
        showUsersError(await errorText(res, 'Could not update admin status'));
        return;
      }
      if (user) user.is_admin = want;
      renderUsers();
    } catch (e) {
      checkbox.checked = !want;
      showUsersError('Could not reach the server: ' + e.message);
    } finally {
      checkbox.disabled = false;
      if (row) row.classList.remove('adm-row-busy');
    }
  }

  // ── Loading + errors ───────────────────────────────────────────────────────
  /** Prefer the server's JSON error, but fall back to a stripped body if a
   *  proxy answered HTML. */
  async function errorText(res, fallback) {
    let msg = `${fallback} (${res.status}).`;
    try {
      const j = await res.json();
      if (j && j.error) msg = j.error;
    } catch (_) {
      try {
        const t = await res.text();
        if (t) msg += ' ' + t.replace(/<[^>]*>/g, ' ').trim().slice(0, 200);
      } catch (__) {}
    }
    return msg;
  }

  function showError(msg) {
    const e = document.getElementById('adm-error');
    e.textContent = msg; e.classList.remove('d-none');
    document.getElementById('adm-status').classList.add('d-none');
  }

  function showUsersError(msg) {
    const e = document.getElementById('adm-users-error');
    e.textContent = msg || '';
    e.classList.toggle('d-none', !msg);
  }

  async function reload() {
    const btn = document.getElementById('adm-refresh');
    if (btn) btn.disabled = true;
    showUsersError('');
    let res;
    try {
      res = await authFetch('/api/admin/users');
    } catch (e) {
      showError('Could not reach the server: ' + e.message);
      return;
    } finally {
      if (btn) btn.disabled = false;
    }
    if (res.status === 403) {
      document.getElementById('adm-status').textContent = '';
      showError('This page is admin-only — your account is not in the admin list.');
      return;
    }
    if (!res.ok) {
      showError(await errorText(res, 'Failed to load users'));
      return;
    }
    USERS = (await res.json()).users || [];
    document.getElementById('adm-status').classList.add('d-none');
    document.getElementById('adm-error').classList.add('d-none');
    document.getElementById('adm-body').classList.remove('d-none');
    renderUsers();
  }

  (async () => {
    const statusEl = document.getElementById('adm-status');
    statusEl.textContent = 'Loading…';
    document.getElementById('adm-search').addEventListener('input', renderUsers);
    try {
      const cfg = await (await fetch('/api/firebase-config')).json();
      if (cfg.error) throw new Error('Firebase not configured');
      firebase.initializeApp({
        apiKey: cfg.FIREBASE_API_KEY, authDomain: cfg.FIREBASE_AUTH_DOMAIN,
        projectId: cfg.FIREBASE_PROJECT_ID, appId: cfg.FIREBASE_APP_ID,
      });
      firebase.auth().onAuthStateChanged(async user => {
        if (!user) {
          statusEl.innerHTML = 'Please <a href="/">sign in on the main page</a> first, then come back.';
          return;
        }
        AUTH_USER = user;
        document.getElementById('adm-summary').textContent = user.email || '';
        await reload();
      });
    } catch (e) { showError(e.message); }
  })();
  </script>
</body>
</html>
